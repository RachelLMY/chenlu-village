<style>
/* Layout: one-column phone game — HUD with player portrait + clock, 7 place tabs, scene panel, fixed bottom action bar. Background tints with time of day. */
:root{
  --base:#e9f0dd; --bg:var(--base); --paper:#fbfdf5; --ink:#24301d; --muted:#647058;
  --soil:#8a5f3c; --soil-wet:#5b3d26; --leaf:#4e8a3a; --sun:#f0b429; --sea:#2f7f9a; --rail:#7a5bc4; --love:#d9506e;
  --line:#cdd8bd; color-scheme:light;
  --display:"ZCOOL KuaiLe","Noto Sans SC",system-ui,sans-serif;
  --body:"Noto Sans SC",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
}
/* 游戏固定用浅色（GBA 米色框），不跟手机深色模式 */
@media (prefers-color-scheme: dark){:root.force-dark-never{
  --base:#131a12; --paper:#1c2519; --ink:#e6eedb; --muted:#9aa88c; --soil:#7a5235; --soil-wet:#4a321f;
  --leaf:#6fb456; --sun:#f5c24a; --sea:#3f9cbc; --rail:#9a7ee0; --love:#e8708c; --line:#2f3b2a; color-scheme:dark}}
:root.force-dark-never{
  --base:#131a12; --paper:#1c2519; --ink:#e6eedb; --muted:#9aa88c; --soil:#7a5235; --soil-wet:#4a321f;
  --leaf:#6fb456; --sun:#f5c24a; --sea:#3f9cbc; --rail:#9a7ee0; --love:#e8708c; --line:#2f3b2a; color-scheme:dark}
body.ph-noon{--bg:color-mix(in srgb,var(--base) 88%,#f4c26b)}
body.ph-eve{--bg:color-mix(in srgb,var(--base) 74%,#3a3f78)}
body.ph-late{--bg:color-mix(in srgb,var(--base) 62%,#1c1f45)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;transition:background .6s;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 96px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance}
h1{font-size:24px;letter-spacing:1px}
h2{font-size:20px}
h3{font-size:17px}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
button:disabled{opacity:.4;cursor:not-allowed}
svg{display:block}
.hud{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;background:var(--paper);border:1.5px solid var(--line);border-radius:16px;padding:10px 12px}
.hud .me{width:56px;height:56px;border-radius:50%;background:var(--bg);border:2px solid var(--line);overflow:hidden}
.hud .date{font-size:13px;color:var(--muted)}
.hud .clock{font-family:var(--display);font-size:16px;font-variant-numeric:tabular-nums}
.hud .fest{font-size:12px;color:var(--love);font-weight:700}
.gold{font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums;color:var(--soil);text-align:right;line-height:1.1}
.gold small{font-family:var(--body);font-size:12px;color:var(--muted)}
.energy{grid-column:1/-1;display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted)}
.bar{flex:1;height:10px;border-radius:6px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--leaf);transition:width .3s}
.bar.hp i{background:var(--love)}
.bar.day i{background:var(--sun)}
.tabs{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.tab{padding:9px 0;border-radius:11px;background:var(--paper);border:1.5px solid var(--line);font-weight:500;font-size:13px}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.panel{background:var(--paper);border:1.5px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.where{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.where span{font-size:13px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.plot{aspect-ratio:1;max-width:100%;border-radius:10px;background:var(--soil);position:relative;display:grid;place-items:center;
  font-size:28px;line-height:1;box-shadow:inset 0 -4px 0 rgba(0,0,0,.18)}
.plot.empty{background:repeating-linear-gradient(0deg,var(--soil) 0 7px,color-mix(in srgb,var(--soil) 82%,#000) 7px 9px)}
.plot.wet{background:var(--soil-wet)}
.plot.ripe{outline:3px solid var(--sun)}
.plot .d{position:absolute;bottom:3px;right:5px;font-size:10px;color:#fff;font-family:var(--body);opacity:.85}
.plot .w{position:absolute;top:3px;left:5px;font-size:10px;color:#bfe6ff;font-family:var(--body)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:6px 10px;border-radius:20px;border:1.5px solid var(--line);font-size:13px;background:var(--bg);display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{border-color:var(--leaf);background:color-mix(in srgb,var(--leaf) 20%,var(--paper))}
.sw{width:14px;height:14px;border-radius:50%;border:1px solid rgba(0,0,0,.2);flex:none}
.swatch{width:30px;height:30px;border-radius:50%;border:2px solid var(--line)}
.swatch[aria-pressed="true"]{border:3px solid var(--ink)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{padding:8px 13px;border-radius:12px;background:var(--bg);border:1.5px solid var(--line);font-weight:500;font-size:14px}
.btn.sm{padding:4px 9px;font-size:12px;border-radius:9px}
.btn.main{background:var(--leaf);color:#fff;border-color:var(--leaf)}
.btn.love{background:var(--love);color:#fff;border-color:var(--love)}
.btn.sea{background:var(--sea);color:#fff;border-color:var(--sea)}
.btn.rail{background:var(--rail);color:#fff;border-color:var(--rail)}
.btn.sun{background:var(--sun);color:#3a2a00;border-color:var(--sun)}
.label{font-size:12px;letter-spacing:.06em;color:var(--muted)}
.people{display:grid;gap:10px}
.person{display:grid;grid-template-columns:68px 1fr;gap:10px;align-items:start;padding:10px;border-radius:14px;background:var(--bg)}
.person .pic{width:68px;height:68px;border-radius:14px;overflow:hidden;background:var(--paper)}
.person .meta{min-width:0;display:flex;flex-direction:column;gap:4px}
.person .name{font-weight:700}
.person .job{font-size:12px;color:var(--muted)}
.hearts{color:var(--love);letter-spacing:1px;font-size:14px}
.hearts b{color:var(--line);font-weight:400}
.hearts.f{color:var(--sun)}
.tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:10px;background:var(--love);color:#fff;margin-left:6px;vertical-align:2px;font-weight:500}
.tag.f{background:var(--sun);color:#3a2a00}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:12px;background:var(--bg);text-align:left;min-width:0}
.item .e{font-size:24px;flex:none}
.item .t{display:flex;flex-direction:column;font-size:13px;line-height:1.3;min-width:0}
.item .t small{color:var(--muted);font-variant-numeric:tabular-nums}
.recipe{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px;border-radius:12px;background:var(--bg)}
.recipe .e{font-size:30px}
.recipe .t{min-width:0;font-size:13px;line-height:1.35}
.recipe .t small{display:block;color:var(--muted)}
.recipe .lack{color:var(--love)}
.ports{display:grid;gap:10px}
.port{padding:12px;border-radius:14px;background:var(--bg);display:flex;flex-direction:column;gap:6px}
.port p{font-size:13px;color:var(--muted)}
.banner{padding:12px;border-radius:14px;background:color-mix(in srgb,var(--love) 14%,var(--paper));border:1.5px solid var(--love);display:flex;flex-direction:column;gap:8px}
.warn{padding:10px 12px;border-radius:12px;background:color-mix(in srgb,var(--love) 12%,var(--paper));font-size:13px}
.log{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:2px;max-height:120px;overflow:auto}
.log div:first-child{color:var(--ink)}
.dock{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1.5px solid var(--line);
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:5}
.dock .in{max-width:560px;margin:0 auto;display:flex;gap:8px}
.dock .btn{flex:1;padding:11px}
.dock .btn.music{flex:0 0 auto}
.modal{position:fixed;inset:0;background:rgba(10,15,8,.55);display:grid;place-items:end center;z-index:20;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{background:var(--paper);border-radius:18px;padding:16px;width:100%;max-width:520px;display:flex;flex-direction:column;gap:12px;max-height:88vh;overflow:auto}
.talk{display:grid;grid-template-columns:80px 1fr;gap:12px;align-items:start}
.talk .pic{width:80px;height:80px;border-radius:16px;overflow:hidden;background:var(--bg)}
.talk p{background:var(--bg);padding:10px 12px;border-radius:12px;font-size:15px}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);
  padding:8px 16px;border-radius:20px;font-size:14px;z-index:30;max-width:90vw;text-align:center}
.family{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;padding:10px;border-radius:14px;background:color-mix(in srgb,var(--love) 10%,var(--paper))}
.fm{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;text-align:center}
.stage{display:grid;place-items:center;padding:12px;border-radius:16px;background:linear-gradient(var(--bg),color-mix(in srgb,var(--leaf) 20%,var(--bg)))}
.stage.night{background:linear-gradient(#1d2450,#3b2a5a);color:#fff}
.stage.sakura{background:linear-gradient(#ffe3ec,#f7c3d4)}
.duo{display:flex;justify-content:center;align-items:flex-end;gap:4px;flex-wrap:nowrap}
.istage{position:relative}.embrace{display:block;width:100%;height:auto}.walkstage{position:relative;overflow:hidden}.walkstage .road{position:absolute;left:0;right:0;bottom:0;height:22px;background:repeating-linear-gradient(90deg,#c9a46a 0 26px,#b8925a 26px 52px);animation:roadmove 1.6s linear infinite;z-index:0}
.walkduo{position:relative;z-index:1;animation:walkbob .8s ease-in-out infinite!important}@keyframes walkbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}@keyframes roadmove{from{background-position:0 0}to{background-position:-52px 0}}
.istage .ifx{position:absolute;font-size:30px;z-index:3;animation:ifloat 2.4s ease-in-out infinite}.istage .ifx.b{font-size:22px;animation-delay:-1.1s}
.istage .ifx.beat{font-size:34px;animation:ibeat .55s ease-in-out infinite}
@keyframes ifloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}@keyframes ibeat{0%,100%{transform:scale(1)}30%{transform:scale(1.35)}60%{transform:scale(1.05)}}
@media (prefers-reduced-motion:reduce){.istage .ifx{animation:none}}
.kissart .kbk{animation:kbk 3.2s ease-in-out infinite alternate}.kissart .ksp{transform-box:fill-box;transform-origin:center;animation:ksp 1.6s ease-in-out infinite}.kissart .khp{transform-box:fill-box;transform-origin:center;animation:ibeat .6s ease-in-out infinite}.kissart .khf,.kissart .khf2{animation:khf 2.6s ease-in-out infinite}.kissart .khf2{animation-delay:-1.3s}.kissart .ktx{animation:khf 2s ease-in-out infinite}@keyframes kbk{from{opacity:.1}to{opacity:.4}}@keyframes ksp{0%,100%{transform:scale(.6);opacity:.5}50%{transform:scale(1.15);opacity:1}}@keyframes khf{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}@media (prefers-reduced-motion:reduce){.kissart *{animation:none!important}}

.creator{display:grid;grid-template-columns:140px 1fr;gap:12px;align-items:start}
.creator .stage{padding:6px}
.tryon{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tryon figure{margin:0;display:grid;gap:6px;text-align:center}.tryon figcaption{font-size:13px;color:var(--ink2,inherit);opacity:.8}.tryon .stage{padding:6px}
.fields{display:flex;flex-direction:column;gap:10px;min-width:0}
input[type=text]{font:inherit;padding:8px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
.cal{display:grid;gap:4px;font-size:13px}
.cal div{display:flex;justify-content:space-between;gap:8px;padding:6px 10px;border-radius:10px;background:var(--bg)}
.cal div.now{background:color-mix(in srgb,var(--love) 18%,var(--paper));font-weight:700}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

details.roster summary{cursor:pointer;font-size:13px;color:var(--muted);padding:4px 0}

/* ===== GBA（矿石镇的伙伴们）风格 ===== */
html.gba{--gb-ink:#3a2a1e;--gb-paper:#fff6dc;--gb-edge:#8a5a2b;--gb-font:"DotGothic16","Noto Sans SC",system-ui,sans-serif}

/* ================= 储物系统（对应 Unity StorageContainer / ContainerType） =================

const CONT={box:{n:'木质储物箱',e:'📦',slots:20,food:false},fridge:{n:'冰箱',e:'🧊',slots:30,food:true}};
const isFood=k=>!!(CROPS[k]||DISH[k]||FISHI[k]||(ING[k]&&k!=='gem')||['bigegg','goldmilk','chestnut','bamboo'].includes(k));
const fridgeOn=()=>S.room.some(f=>f.k==='fridge');
const fr=k=>fridgeOn()?(S.store.fridge[k]||0):0;
const haveC=k=>have(k)+fr(k);
function takeC(k,n){const a=Math.min(have(k),n);S.bag[k]-=a;if(n-a>0)S.store.fridge[k]-=n-a}
function deposit(kind,k,n){
  const C=CONT[kind],st=S.store[kind];
  if(C.food&&!isFood(k)){toast(`这是${C.n}，只能放入食物和食材哦！`);return false}
  const used=Object.values(st).filter(v=>v>0).length;
  if(!st[k]&&used>=C.slots){toast(`${C.n}已经装满了！（${C.slots} 格）`);return false}
  n=Math.min(n,have(k));if(n<=0)return false;S.bag[k]-=n;st[k]=(st[k]||0)+n;sfx('pickup');toast(`成功将 ${ITEMS[k].n}×${n} 存入${C.n}`);return true}
function withdraw(kind,k,n){const st=S.store[kind];n=Math.min(n,st[k]||0);if(n<=0)return;st[k]-=n;add(k,n);sfx('pickup');toast(`从${CONT[kind].n}拿出 ${ITEMS[k].n}×${n}`)}

  if(big)C.push(['kidplay',`刚才${big.name}拿着树枝在院子里模仿你走路的样子，真是太逗了，哈哈。`,'happy']);
  else if(kid)C.push(['kidwalk',`${kid.name}今天又摇摇晃晃地追着小鸡跑了一圈，你没看到真可惜。`,'happy']);
  if(ph==='eve')C.push(['eve','辛苦啦，今天过得怎么样？过来坐，跟我说说。','']);

let CALV=null;
function dayToSD(day){return{s:Math.floor((day-1)/28)%4,d:((day-1)%28)+1,y:Math.floor((day-1)/112)+1}}
function calEvents(s,d,y){
  const E=[];
  FESTS.forEach((f,i)=>{if(f.s===s&&f.d===d)E.push(['🎉',`${f.n}（${TOWNS[f.t].n}）`,'fest'])});
  P.forEach(q=>{if(q.bday.s===s&&q.bday.d===d)E.push(['🎂',`${q.n}生日（${TOWNS[q.town].n}）${q.id===S.spouse?' · 伴侣':''}`,'bday'])});
  if(S.spouse&&S.married){const m=dayToSD(S.married);if(m.s===s&&m.d===d&&y>m.y)E.push(['💍',`结婚 ${y-m.y} 周年纪念日`,'love']);else if(m.s===s&&m.d===d&&y===m.y)E.push(['💍','我们结婚的日子','love'])}
  S.kids.forEach(k=>{const b=dayToSD(k.born);if(b.s===s&&b.d===d)E.push(['🍼',y>b.y?`${k.name} ${y-b.y} 岁生日`:`${k.name}出生`,'love'])});
  if(S.preg){const b=dayToSD(S.preg);if(b.s===s&&b.d===d&&b.y===y)E.push(['👶','宝宝预产期','love'])}
  if(d===1)E.push(['🌱',`${SEASONS[s]}季第一天 · 不当季作物会枯萎`,'note']);

  return E;
}

  try{if(txt.startsWith('CL1:'))o=JSON.parse(decodeURIComponent(escape(atob(txt.slice(4).replace(/\s+/g,'')))));else if(txt.startsWith('{'))o=JSON.parse(txt)}catch(e){return null}
  return o&&o.plots&&o.rel&&o.me?o:null}
function exportSave(){
  save();const code=saveCode(),c=cal(),kb=Math.round(code.length/1024);
  modal(`<h2>💾 导出存档</h2><p>${S.me.name||'我'} · 第 ${c.y} 年${SEASONS[c.s]}季第 ${c.d} 天 · ${fmt(S.gold)} 金${spouseP()?` · 伴侣 ${spouseP().n}`:''}</p>
    <textarea id="svcode" class="svbox" readonly>${code}</textarea>
    <div class="row"><button class="btn main" data-sv="copy">复制存档码</button>${window.self===window.top?'<button class="btn" data-sv="file">下载存档文件</button>':''}</div>

}
function importSave(){
  modal(`<h2>📥 导入存档</h2><p class="label">把之前导出的存档码贴在下面，或者选择存档文件。<b>导入会覆盖现在的进度。</b></p>
    <textarea id="svin" class="svbox" placeholder="CL1:……"></textarea>
    <label class="btn" style="text-align:center;cursor:pointer">📂 选择存档文件<input type="file" id="svfile" accept=".json,.txt,application/json,text/plain" hidden></label>
    <div class="row"><button class="btn main" data-sv="load">读取并继续玩</button><button class="btn" data-close>取消</button></div>`);

function svAct(a){
  if(a==='export')return exportSave();

    if(navigator.clipboard)navigator.clipboard.writeText(t.value).then(()=>toast('✅ 存档码已复制')).catch(()=>toast(ok?'✅ 存档码已复制':'请长按文字框全选复制'));else toast(ok?'✅ 存档码已复制':'请长按文字框全选复制');return}
  if(a==='file'){const c0=cal(),fn=`晨露村存档-第${c0.y}年${SEASONS[c0.s]}季${c0.d}日.txt`;
    if(window.claude&&window.claude.use){window.claude.use('downloads').then(dl=>{if(!dl){toast('这里不能下载文件，请用「复制存档码」');return}return dl.save({filename:fn,data:saveCode()}).then(()=>toast('✅ 已保存存档文件'))}).catch(e=>toast(e&&e.code==='declined'?'已取消':'这里不能下载文件，请用「复制存档码」'));return}
    try{const c=cal(),blob=new Blob([saveCode()],{type:'text/plain'}),u=URL.createObjectURL(blob),el=document.createElement('a');el.href=u;el.download=`晨露村存档-第${c.y}年${SEASONS[c.s]}季${c.d}日.txt`;document.body.appendChild(el);el.click();el.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);toast('已开始下载')}catch(e){toast('这里不能下载文件，请用「复制存档码」')}return}
  if(a==='load'){const o=parseSave($('svin').value);if(!o){toast('❌ 存档码不对，请检查是否完整复制');sfx('fail');return}
    try{localStorage.setItem(SAVE,JSON.stringify(o))}catch(e){toast('浏览器不允许保存');return}toast('✅ 存档已导入，重新载入中…');setTimeout(()=>location.reload(),600)}
}
